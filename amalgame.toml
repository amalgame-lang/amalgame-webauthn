# amalgame-webauthn — WebAuthn / passkeys relying-party verifier.
#
# Server-side verification of the two WebAuthn ceremonies (registration
# attestation + authentication assertion) for ES256 (P-256) credentials.
#
# Install:
#   amc package add crypto
#   amc package add webauthn

[package]
name              = "amalgame-webauthn"
version           = "0.1.0"
license           = "Apache-2.0"
description       = "WebAuthn / passkeys relying-party (server) verifier for ES256 (P-256) credentials. VerifyRegistration parses the attestationObject (CBOR) + clientDataJSON, validates type/challenge/origin, confirms the rpIdHash and User-Present flag, and extracts the credential id + COSE EC2 public key. VerifyAssertion validates the client data, confirms rpIdHash + User-Present, then cryptographically VERIFIES the assertion signature over authenticatorData||SHA-256(clientDataJSON) with the stored public key (crypto v0.7.0 JwsKey.FromCoseEc2 + VerifyDer) and enforces a strictly-increasing signature counter (cloned-authenticator detection). NewChallenge() mints a 32-byte CSPRNG challenge. Includes a small decode-only CBOR reader (the subset attestationObject + COSE_Key need). Scope v0.1.0: ES256 + attestation format none (the privacy-preserving default — the key is bound by the assertion signature at login, not an attestation cert chain); attestation-statement / cert-chain verification (packed/tpm/android-key) is a future addition. Verification never throws — every failure returns Ok=false with a specific Error."
authors           = ["Bastien Mouget"]
required-amalgame = ">=0.8.72"
schema-version    = 1

[dependencies]
amalgame-crypto = ">=0.7.0"

[stdlib]
classes   = [
    "CborValue",
    "CborReader",
    "RegistrationResult",
    "AssertionResult",
    "StoredCredential",
    "WebAuthn",
]
namespace = "Amalgame.WebAuthn"
header    = "facade-stub.h"
facade    = "facade.am"
libs      = []
